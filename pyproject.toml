# Author: André Henrique (@mrhenrike) | https://github.com/mrhenrike

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudxpl-forge"
version = "1.0.0"
description = "CloudXPL-Forge (CXF) — Cloud security assessment framework. AWS, Azure, GCP enumeration and exploitation."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [
    { name = "André Henrique", email = "henrique.santos@uniaogeek.com.br" },
]
keywords = [
    "security", "pentesting", "cloud-security", "aws", "azure", "gcp",
    "iam", "s3", "ssrf", "imds", "red-team", "exploit", "xpl-forge",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0,<3.0",
    "rich>=13.0",
    "dnspython>=2.4",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
azure = ["azure-identity>=1.15", "azure-mgmt-resource>=23.0", "azure-mgmt-storage>=21.0"]
gcp = ["google-cloud-storage>=2.14", "google-cloud-resource-manager>=1.12"]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.0"]
full = ["boto3>=1.34", "azure-identity>=1.15", "azure-mgmt-resource>=23.0", "azure-mgmt-storage>=21.0", "google-cloud-storage>=2.14", "google-cloud-resource-manager>=1.12"]

[project.urls]
Homepage   = "https://github.com/mrhenrike/CloudXPL-Forge"
Repository = "https://github.com/mrhenrike/CloudXPL-Forge"

[project.scripts]
cxf      = "cloudxpl.__main__:main"
cloudxpl = "cloudxpl.__main__:main"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
where   = ["."]
include = ["cloudxpl*"]
