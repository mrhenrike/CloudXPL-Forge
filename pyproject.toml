# Author: André Henrique (@mrhenrike) | https://github.com/mrhenrike

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudxpl-forge"
version = "2.0.0"
description = "CloudXPL-Forge (CXF) — Cloud security assessment framework. 212 modules across AWS, Azure, GCP, Kubernetes, serverless, storage, multi-cloud, credential and network attack surfaces."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [
    { name = "André Henrique", email = "henrique.santos@uniaogeek.com.br" },
]
keywords = [
    "security", "pentesting", "cloud-security", "aws", "azure", "gcp",
    "kubernetes", "k8s", "serverless", "lambda", "iam", "s3", "ssrf", "imds",
    "container-escape", "privilege-escalation", "credential-theft",
    "bucket-exploit", "blob-exploit", "entra-id", "aks", "eks", "gke",
    "cloud-exploit", "red-team", "purple-team", "cve", "kev",
    "data-exfiltration", "storage-attack", "multi-cloud", "xpl-forge",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0,<3.0",
    "rich>=13.0",
    "dnspython>=2.4",
    "xpl-core>=0.1.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
azure = [
    "azure-identity>=1.15",
    "azure-mgmt-resource>=23.0",
    "azure-mgmt-storage>=21.0",
    "azure-mgmt-compute>=30.0",
    "azure-mgmt-network>=25.0",
    "azure-keyvault-secrets>=4.7",
    "msgraph-sdk>=1.0",
]
gcp = [
    "google-cloud-storage>=2.14",
    "google-cloud-resource-manager>=1.12",
    "google-cloud-compute>=1.14",
    "google-cloud-iam>=2.12",
    "google-cloud-secret-manager>=2.16",
]
k8s = ["kubernetes>=29.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.0"]
full = [
    "boto3>=1.34",
    "azure-identity>=1.15",
    "azure-mgmt-resource>=23.0",
    "azure-mgmt-storage>=21.0",
    "azure-mgmt-compute>=30.0",
    "azure-mgmt-network>=25.0",
    "azure-keyvault-secrets>=4.7",
    "msgraph-sdk>=1.0",
    "google-cloud-storage>=2.14",
    "google-cloud-resource-manager>=1.12",
    "google-cloud-compute>=1.14",
    "google-cloud-iam>=2.12",
    "google-cloud-secret-manager>=2.16",
    "kubernetes>=29.0",
]

[project.urls]
Homepage   = "https://github.com/mrhenrike/CloudXPL-Forge"
Repository = "https://github.com/mrhenrike/CloudXPL-Forge"

[project.scripts]
cxf      = "cloudxpl.__main__:main"
cloudxpl = "cloudxpl.__main__:main"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
where   = ["."]
include = ["cloudxpl*"]
