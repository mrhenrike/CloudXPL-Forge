# Author: André Henrique (@mrhenrike) | https://github.com/mrhenrike

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudxpl"
version = "4.2.0"
description = "CloudXPL-Forge (CXF) — Cloud security assessment framework. 508 modules across 20 categories: AWS, Azure, GCP, OCI, Alibaba, Tencent, IBM, DigitalOcean, OVHcloud, Hetzner, Kubernetes, serverless, storage, multi-cloud, hypervisors (VMware ESXi/vCenter, Hyper-V, KVM/QEMU, Xen/Citrix, Nutanix, Firecracker, Kata, side-channel), VDI escape, PaaS escape, CI/CD runner escape, 100+ CVEs 2019-2026, VM/container/tenant escape, credential and network attack surfaces."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "BSD-3-Clause" }
authors = [
    { name = "André Henrique", email = "henrique.santos@uniaogeek.com.br" },
]
keywords = [
    "security", "pentesting", "cloud-security", "aws", "azure", "gcp",
    "oci", "oracle-cloud", "alibaba-cloud", "tencent-cloud", "ibm-cloud",
    "digitalocean", "ovhcloud", "hetzner", "vmware", "esxi", "vcenter",
    "hyper-v", "kvm", "qemu", "citrix", "nutanix", "hypervisor",
    "vm-escape", "kubernetes", "k8s", "serverless", "lambda", "iam",
    "s3", "ssrf", "imds", "container-escape", "privilege-escalation",
    "credential-theft", "bucket-exploit", "blob-exploit", "entra-id",
    "aks", "eks", "gke", "cloud-exploit", "red-team", "purple-team",
    "cve", "kev", "rsa-securid", "data-exfiltration", "storage-attack",
    "multi-cloud", "xpl-forge", "tenant-escape", "guest-to-host",
    "firecracker", "kata-containers", "vdi-escape", "runc-escape",
    "dirty-pipe", "openslp", "vmci", "xen-xsa", "remotefx",
    "paas-escape", "cicd-escape", "github-actions", "gitlab-ci",
    "jenkins", "terraform", "azurescape", "cloud-run", "fargate",
    "horizon", "citrix-vda", "avd", "workspaces", "sev-snp",
    "tdx", "side-channel", "spectre", "nitro-enclaves",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0,<3.0",
    "rich>=13.0",
    "dnspython>=2.4",
    "xpl-core>=0.1.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
azure = [
    "azure-identity>=1.15",
    "azure-mgmt-resource>=23.0",
    "azure-mgmt-storage>=21.0",
    "azure-mgmt-compute>=30.0",
    "azure-mgmt-network>=25.0",
    "azure-keyvault-secrets>=4.7",
    "msgraph-sdk>=1.0",
]
gcp = [
    "google-cloud-storage>=2.14",
    "google-cloud-resource-manager>=1.12",
    "google-cloud-compute>=1.14",
    "google-cloud-iam>=2.12",
    "google-cloud-secret-manager>=2.16",
]
k8s = ["kubernetes>=29.0"]
oci = ["oci>=2.120"]
alibaba = ["alibabacloud-credentials>=0.3", "alibabacloud-ecs20140526>=4.0", "alibabacloud-oss20190517>=1.0"]
tencent = ["tencentcloud-sdk-python>=3.0"]
ibm = ["ibm-cloud-sdk-core>=3.16", "ibm-cos-sdk>=2.13"]
digitalocean = ["pydo>=0.8"]
ovh = ["ovh>=1.1"]
hetzner = ["hcloud>=2.0"]
virt = ["pyvmomi>=8.0", "libvirt-python>=10.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.0"]
full = [
    "boto3>=1.34",
    "azure-identity>=1.15",
    "azure-mgmt-resource>=23.0",
    "azure-mgmt-storage>=21.0",
    "azure-mgmt-compute>=30.0",
    "azure-mgmt-network>=25.0",
    "azure-keyvault-secrets>=4.7",
    "msgraph-sdk>=1.0",
    "google-cloud-storage>=2.14",
    "google-cloud-resource-manager>=1.12",
    "google-cloud-compute>=1.14",
    "google-cloud-iam>=2.12",
    "google-cloud-secret-manager>=2.16",
    "kubernetes>=29.0",
    "oci>=2.120",
    "alibabacloud-credentials>=0.3",
    "alibabacloud-ecs20140526>=4.0",
    "alibabacloud-oss20190517>=1.0",
    "tencentcloud-sdk-python>=3.0",
    "ibm-cloud-sdk-core>=3.16",
    "ibm-cos-sdk>=2.13",
    "pydo>=0.8",
    "ovh>=1.1",
    "hcloud>=2.0",
    "pyvmomi>=8.0",
    "libvirt-python>=10.0",
]

[project.urls]
Homepage      = "https://github.com/mrhenrike/CloudXPL-Forge"
Repository    = "https://github.com/mrhenrike/CloudXPL-Forge"
Documentation = "https://github.com/mrhenrike/CloudXPL-Forge/wiki"
"Bug Tracker" = "https://github.com/mrhenrike/CloudXPL-Forge/issues"
Changelog     = "https://github.com/mrhenrike/CloudXPL-Forge/releases"

[project.scripts]
cxf      = "cloudxpl.__main__:main"
cloudxpl = "cloudxpl.__main__:main"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_reexport = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "requests.*",
    "rich.*",
    "dns.*",
    "boto3.*",
    "botocore.*",
    "azure.*",
    "msrest.*",
    "msgraph.*",
    "google.*",
    "google.cloud.*",
    "kubernetes.*",
    "oci.*",
    "alibabacloud_credentials.*",
    "alibabacloud_ecs20140526.*",
    "alibabacloud_oss20190517.*",
    "tencentcloud.*",
    "ibm_cloud_sdk_core.*",
    "ibm_boto3.*",
    "pydo.*",
    "ovh.*",
    "hcloud.*",
    "pyvmomi.*",
    "pyVmomi.*",
    "pyVim.*",
    "libvirt.*",
    "xpl_core.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "cloudxpl.modules.*",
    "cloudxpl.core.*",
]
ignore_errors = true

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [
    "cloudxpl/resources/**",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "RUF"]
ignore = [
    "E101",
    "E501",
    "E701",
    "E702",
    "E703",
    "E711",
    "E712",
    "E721",
    "E722",
    "E741",
    "W191",
    "W291",
    "W292",
    "W293",
    "F403",
    "F405",
    "F541",
    "F811",
    "B007",
    "B008",
    "B023",
    "B028",
    "B904",
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM110",
    "SIM113",
    "SIM114",
    "SIM115",
    "SIM117",
    "SIM210",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF005",
    "RUF012",
    "RUF013",
    "RUF015",
    "RUF046",
    "RUF059",
]

[tool.ruff.lint.per-file-ignores]
"cloudxpl/modules/**" = ["F401", "F404", "F523", "F524", "F601", "F821", "F841", "F842", "E402", "E731", "I001", "B006", "B012", "B018", "B026", "SIM101", "SIM112", "SIM116", "SIM118", "SIM201", "SIM211", "SIM212", "SIM905", "RUF034", "BLE001"]
"cloudxpl/core/**" = ["F401", "F601", "F821", "F841", "E402", "I001", "B005", "B006", "B012", "SIM101", "SIM112", "SIM118", "SIM201", "SIM212", "BLE001"]
"cloudxpl/__main__.py" = ["E402"]
"tests/**" = ["E402"]
"tools/**" = ["F841", "E402", "B005"]

[tool.ruff.lint.isort]
known-first-party = ["cloudxpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
where   = ["."]
include = ["cloudxpl*"]
